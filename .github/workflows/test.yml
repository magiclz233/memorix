name: 测试

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: 质量门禁（lint / typecheck / unit test）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 获取 pnpm 缓存目录
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 缓存 pnpm 依赖
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 ESLint
        run: pnpm lint

      - name: TypeScript 类型检查
        run: pnpm exec tsc --noEmit

      # 真实门禁：不再 continue-on-error。测试失败必须让 CI 变红（ADR-0004）。
      - name: 运行单元测试
        run: pnpm test:unit

      - name: 生成覆盖率报告
        run: pnpm test:coverage
        continue-on-error: true

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-summary.json
          fail_ci_if_error: false

# 说明：此前存在 integration-tests job，调用不存在的 `pnpm test:integration`
# 并 continue-on-error，属于恒绿的假门禁，已移除。
# ADR-0004 明确本阶段只做 Vitest 接口测试，不含浏览器 E2E / 集成测试。
# 待对应测试真正落地后再新增相应 job，且一律不得 continue-on-error。
